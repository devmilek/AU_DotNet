services:
  metrics-gateway:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      METRICS_USERNAME: ${METRICS_USERNAME:?}
      METRICS_PASSWORD_HASH: ${METRICS_PASSWORD_HASH:?}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      - default
      - dokploy-network

  prometheus:
    image: prom/prometheus:v3.15.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-30d}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-10GB}
      - --web.enable-remote-write-receiver
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:13.2.2
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SERVER_ROOT_URL: https://${GRAFANA_DOMAIN:?}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: ${SMTP_HOST:?}:${SMTP_PORT:?}
      GF_SMTP_USER: ${SMTP_USERNAME:?}
      GF_SMTP_PASSWORD: ${SMTP_PASSWORD:?}
      GF_SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:?}
      GF_SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Asterio Monitoring}
      ALERT_EMAIL: ${ALERT_EMAIL:?}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks:
      - default
      - dokploy-network

volumes:
  prometheus-data:
  grafana-data:

networks:
  dokploy-network:
    external: true
