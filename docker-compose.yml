x-dotnet-env: &dotnet-env
  ASPNETCORE_ENVIRONMENT: Production
  ConnectionStrings__app: Host=postgres;Port=5432;Database=app;Username=${POSTGRES_USER:?};Password=${POSTGRES_PASSWORD:?}
  ConnectionStrings__rabbitmq: amqp://${RABBITMQ_USER:?}:${RABBITMQ_PASS:?}@rabbitmq:5672
  OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4317
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc

x-mail-env: &mail-env
  Auth__FrontendUrl: ${FRONTEND_URL:?}
  Smtp__Host: ${SMTP_HOST:?}
  Smtp__Port: ${SMTP_PORT:?}
  Smtp__Username: ${SMTP_USERNAME:?}
  Smtp__Password: ${SMTP_PASSWORD:?}
  Smtp__FromAddress: ${SMTP_FROM:?}

x-dotnet: &dotnet
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy

services:
  postgres:
    image: timescale/timescaledb:2.30.1-pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: app
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d app"]
      interval: 5s
      timeout: 5s
      retries: 30

  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:?}
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 30

  api:
    <<: *dotnet
    build:
      context: .
      args:
        PROJECT: AU.Api
    environment:
      <<: [*dotnet-env, *mail-env]
    volumes:
      - storage:/app/storage

  check-scheduler:
    <<: *dotnet
    build:
      context: .
      args:
        PROJECT: AU.CheckScheduler
    environment: *dotnet-env

  check-worker:
    <<: *dotnet
    build:
      context: .
      args:
        PROJECT: AU.CheckWorker
    environment: *dotnet-env

  jobs:
    <<: *dotnet
    build:
      context: .
      args:
        PROJECT: AU.Jobs
    environment: *dotnet-env

  notification-worker:
    <<: *dotnet
    build:
      context: .
      args:
        PROJECT: AU.NotificationWorker
    environment:
      <<: [*dotnet-env, *mail-env]

  web:
    build:
      context: ./web
      args:
        API_URL: http://api:8080
    restart: unless-stopped
    environment:
      API_URL: http://api:8080
    depends_on:
      - api
    networks:
      - default
      - dokploy-network

  alloy:
    build:
      context: ./deploy/alloy
    restart: unless-stopped
    privileged: true
    environment:
      SERVER_NAME: ${SERVER_NAME:?}
      METRICS_REMOTE_WRITE_URL: ${METRICS_REMOTE_WRITE_URL:?}
      METRICS_USERNAME: ${METRICS_USERNAME:?}
      METRICS_PASSWORD: ${METRICS_PASSWORD:?}
      POSTGRES_EXPORTER_DSN: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/app?sslmode=disable
    volumes:
      - alloydata:/var/lib/alloy/data
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - /sys:/sys:ro
      - /run/udev/data:/run/udev/data:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro

volumes:
  pgdata:
  rabbitdata:
  storage:
  alloydata:

networks:
  dokploy-network:
    external: true
