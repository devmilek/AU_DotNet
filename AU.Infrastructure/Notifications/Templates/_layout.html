<!DOCTYPE html>
<html lang="pl" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="x-apple-disable-message-reformatting">
    <meta name="color-scheme" content="light dark">
    <meta name="supported-color-schemes" content="light dark">
    <title>{{ title | html.escape }}</title>
    <!-- fonty z frontu; klienci bez obsługi web fontów (np. Gmail) użyją fallbacku z font-family -->
    <link rel="preconnect" href="https://fonts.googleapis.com" data-premailer="ignore">
    <link href="https://fonts.googleapis.com/css2?family=Cal+Sans&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" data-premailer="ignore">
    <style>
{{ styles }}
    </style>
    <style data-premailer="ignore">
{{ media_styles }}
    </style>
</head>
<body>
<!-- preheader: tekst podglądu w skrzynce odbiorczej -->
<div style="display:none;max-height:0;overflow:hidden;opacity:0;mso-hide:all;">{{ preheader | html.escape }}&#8199;&#65279;&#847;&#8199;&#65279;&#847;&#8199;&#65279;&#847;</div>
<table role="presentation" class="wrapper" width="100%" cellpadding="0" cellspacing="0">
    <tr>
        <td class="wrapper-cell" align="center">
            <table role="presentation" class="container" width="100%" cellpadding="0" cellspacing="0">
                <tr>
                    <td class="brand-cell">
                        <a href="{{ app_url | html.escape }}" style="text-decoration:none;">
                            <table role="presentation" cellpadding="0" cellspacing="0">
                                <tr>
                                    <td><img class="brand-logo" src="cid:logo" width="32" height="32" alt="Asterio Uptime"></td>
                                    <td class="brand-name">Asterio Uptime</td>
                                </tr>
                            </table>
                        </a>
                    </td>
                </tr>
                <tr>
                    <td class="frame">
                        <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                            <tr>
                                <td class="card-cell">
{{ content }}
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>
                <tr>
                    <td class="footer-cell">
                        {{~ if footer_note ~}}
                        {{ footer_note | html.escape }}<br>
                        {{~ end ~}}
                        &copy; {{ year }} <a href="{{ app_url | html.escape }}">Asterio Uptime</a> &middot; monitoring dostępności
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
