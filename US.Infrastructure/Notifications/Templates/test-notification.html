<!DOCTYPE html>
<html lang="pl">
<head>
    <style>
        .container { font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; }
        .header { background: #2563eb; color: white; padding: 16px; border-radius: 4px 4px 0 0; }
        .body { padding: 24px; border: 1px solid #e5e5e5; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h2>🧪 Testowe powiadomienie</h2>
    </div>
    <div class="body">
        <p>To jest testowe powiadomienie dla monitora <strong>{{ MonitorName }}</strong>.</p>
        <p>Wysłano: {{ SentAt | date.parse_to_string "%b %d, %y" }}</p>
        <p>Jeśli widzisz tę wiadomość, kanał powiadomień jest skonfigurowany poprawnie.</p>
    </div>
</div>
</body>
</html>
