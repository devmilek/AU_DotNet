<!DOCTYPE html>
<html lang="pl">
<head>
    <style>
        .container { font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; }
        .header { background: #2563eb; color: white; padding: 16px; border-radius: 4px 4px 0 0; }
        .body { padding: 24px; border: 1px solid #e5e5e5; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h2>Potwierdź adres email</h2>
    </div>
    <div class="body">
        <p>Cześć {{ display_name | html.escape }},</p>
        <p>Kliknij przycisk poniżej, aby potwierdzić swój adres email.</p>
        <p><a href="{{ confirmation_url | html.escape }}">Potwierdź email</a></p>
        <p>Link jest ważny przez {{ expires_in_hours }} godzin. Jeśli to nie Ty zakładałeś konto, zignoruj tę wiadomość.</p>
    </div>
</div>
</body>
</html>
